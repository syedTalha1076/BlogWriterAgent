[project]
name = "blogwriteragent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syed Talha Ali Shah", email = "syedtalhaa1076@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.136.3",
    "google-genai>=2.29.0",
    "jinja2==3.1.6",
    "langchain==1.3.2",
    "langchain-community==0.4.2",
    "langchain-google-genai==4.2.4",
    "langchain-groq==1.1.3",
    "langchain-ollama==1.1.0",
    "langchain-tavily==0.2.18",
    "langgraph==1.2.2",
    "langgraph-checkpoint-postgres==3.1.0",
    "psycopg-pool==3.3.1",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "tavily-python==0.7.24",
    "uvicorn==0.48.0",
]

[project.scripts]
blogwriteragent = "blogwriteragent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
